name: Build KSU Mod Manager
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ls
          unzip KernelSU-Next-3.4.2.zip

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          chmod +x manager/gradlew
          ./manager/gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modified-KSU-APK
          path: manager/app/build/outputs/apk/release/*.apk
