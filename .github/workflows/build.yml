name: Build KSU Mod Manager
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source code
        run: unzip KernelSU-Next-3.4.2_new.zip -d ./src

      - name: Set up JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release APK
        run: |
          cd src
          chmod +x manager/gradlew
          ./manager/gradlew assembleRelease

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: Modified-KSU-APK
          path: src/manager/app/build/outputs/apk/release/*.apk
